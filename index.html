<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Campanha C&T 2026</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.19.0/dist/tf.min.js"></script>

<style>
/* --- ESTILOS DO PROJETO --- */
:root{ --g:#0000A0;--gl:#E6E8F5;--gm:#6B7280; --b:#4B5563;--bl:#EEF0F3; --tx:#5F5E5A; --bg:#F4F3EF;--bd:#DDDBD4; --w:#fff;--k:#1E1D1A; --sh:0 2px 10px rgba(0,0,0,.09);--rad:10px; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--k);min-height:100vh;font-size:15px}
header{background:var(--g);color:#fff;padding:.8rem 1.1rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
header h1{font-size:15px;font-weight:700} header p{font-size:11px;opacity:.75;margin-top:1px}
.wrap{max-width:580px;margin:0 auto;padding:1rem .9rem 4rem}
.card{background:var(--w);border-radius:var(--rad);padding:1.2rem;box-shadow:var(--sh);margin-bottom:.8rem}
.card-step{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--gm);margin-bottom:.4rem}
.card h2{font-size:17px;font-weight:700;margin-bottom:.9rem}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--tx);margin-bottom:5px;margin-top:1rem}
select, input{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:7px;font-size:15px;background:var(--w);outline:none;}
.btn{width:100%;padding:13px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;border:none;margin-top:1rem;text-align:center}
.btn-p{background:var(--g);color:#fff} .btn-p:disabled{background:var(--bd);cursor:not-allowed}
.oculto{display:none!important}

/* --- ESTILOS DA CÂMERA AO VIVO --- */
.camera-container { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; position: relative; }
#video-camera { width: 100%; display: block; }
#img-preview { width: 100%; display: none; border-radius: 8px; margin-top: 10px; border: 2px solid var(--g); }
.btn-capturar { background: #b3261e; color: white; border-radius: 50px; margin-top: 10px; padding: 15px; font-size: 16px; }
#status-info { font-size: 12.5px; color: #b3261e; margin-top: 8px; font-weight: bold; line-height: 1.5; }

#ia-loading { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; font-weight: bold; text-align: center; }

.progresso { display:flex; gap:6px; margin-top:10px; }
.progresso span { flex:1; height:5px; border-radius:3px; background:var(--bd); }
.progresso span.feito { background: var(--g); }
.progresso span.atual { background: var(--gm); }

#galeria-fotos { display:flex; gap:8px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
#galeria-fotos img { width:80px; height:80px; object-fit:cover; border-radius:8px; border:2px solid var(--g); }

.btn-confirmar { background:var(--g); color:#fff; }
.btn-refazer-foto { background:#4B5563; color:#fff; }
.linha-botoes { display:flex; gap:8px; margin-top:10px; }
.linha-botoes .btn { margin-top:0; }
</style>
</head>

<header>
  <div style="font-size:22px">📸</div>
  <div><h1>Campanha C&T 2026</h1><p>Registro de "Tudão"</p></div>
</header>

<div class="wrap">
  <div id="ia-loading">🧠 Carregando Inteligência Artificial... Aguarde.</div>

  <div id="step1" class="card">
    <div class="card-step">Passo 1 de 2</div><h2>Identificação da Loja</h2>

    <label class="lbl">Supervisor</label>
    <select id="sel-sup" onchange="liberarPromotor()"><option value="">— Selecione —</option></select>

    <label class="lbl">Promotor</label>
    <select id="sel-prom" disabled onchange="liberarLoja()"><option value="">— Selecione —</option></select>

    <label class="lbl">Loja</label>
    <select id="sel-loja" disabled onchange="habilitarContinuar()"><option value="">— Selecione —</option></select>

    <button class="btn btn-p" id="btn-t1" disabled onclick="irParaPasso2()">Continuar →</button>
  </div>

  <div id="step2" class="card oculto">
    <div class="card-step">Passo 2 de 2</div><h2>Captura In-loco</h2>

    <label class="lbl" id="lbl-tipo-exposicao">Tem Ponto Extra "Tudão" na loja?</label>
    <select id="sel-tudao" onchange="tratarSelecaoTudao()">
      <option value="">— Selecione —</option>
      <option value="Sim">Sim</option>
      <option value="Não">Não</option>
    </select>

    <div id="area-outra-exposicao" class="oculto">

      <select id="input-nome-display" onchange="checarPerguntasExtrasOutra()">

        <option value="Ponta de gôndola">Ponta de gôndola (com petiscos)</option>

        <option value="Sobrecito">Sobrecito</option>
        <option value="4way">4way</option>
        <option value="Backlight">Backlight</option>
        <option value="Checkout">Checkout</option>
        <option value="Sidekick">Sidekick</option>
        <option value="Guerrilha">Guerrilha</option>
        <option value="Gravitacional">Gravitacional</option>
      </select>

      <label class="lbl">Fotos da exposição</label>
      <div class="camera-container" id="camera-box-outra">
        <video id="video-camera-outra" autoplay playsinline></video>
      </div>

      <button class="btn btn-capturar" id="btn-tirar-foto-outra" onclick="capturarFotoOutra()">📷 Capturar Foto — FRENTE (obrigatória)</button>

      <p id="status-info-outra">Aguardando...</p>

      <div class="linha-botoes oculto" id="linha-botoes-revisao-outra">
        <button class="btn btn-refazer-foto" onclick="refazerFotoOutra()">🔄 Tirar novamente</button>
        <button class="btn btn-confirmar" onclick="confirmarFotoOutra()">✅ Confirmar foto</button>
      </div>

      <div id="galeria-fotos-outra" style="display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap;"></div>

      <div id="botoes-mais-fotos-outra" class="oculto linha-botoes">
        <button class="btn" style="background:var(--b);color:#fff;" onclick="adicionarMaisFotoOutra()">➕ Add lateral/traseira</button>
        <button class="btn btn-p" onclick="finalizarFotosOutra()">✅ Concluir fotos</button>
      </div>

      <div id="perguntas-extra-outra" class="oculto">
        <label class="lbl">Tem o petisco Filezitos no display?</label>
        <select id="sel-o-filezitos" onchange="checarPerguntasExtrasOutra()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem o petisco Tasty Bites no display?</label>
        <select id="sel-o-tasty" onchange="checarPerguntasExtrasOutra()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem o petisco Sheba Cremoso no display?</label>
        <select id="sel-o-sheba" onchange="checarPerguntasExtrasOutra()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem algum sachê Pedigree Caramelo no display?</label>
        <select id="sel-o-sache" onchange="checarPerguntasExtrasOutra()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>
      </div>
    </div>


    <div id="area-foto" class="oculto">
      <div class="progresso">
        <span id="prog-1"></span><span id="prog-2"></span><span id="prog-3"></span>
      </div>

      <label class="lbl">Câmera ao vivo</label>

      <div class="camera-container" id="camera-box">
        <video id="video-camera" autoplay playsinline></video>
      </div>

      <button class="btn btn-capturar" id="btn-tirar-foto" onclick="capturarFoto()">📷 Capturar Foto (1/3) — FRENTE</button>

      <p id="status-info">Aguardando permissão de câmera e GPS...</p>

      <img id="img-preview" alt="Preview da Foto">

      <div class="linha-botoes oculto" id="linha-botoes-revisao">
        <button class="btn btn-refazer-foto" id="btn-refazer" onclick="refazerFotoAtual()">🔄 Tirar novamente</button>
        <button class="btn btn-confirmar" id="btn-confirmar" onclick="confirmarFoto()">✅ Confirmar</button>
      </div>

      <div id="galeria-fotos"></div>

      <button class="btn btn-p oculto" id="btn-refazer-tudo" style="background:#4B5563;" onclick="refazerTudo()">🔄 Refazer as 3 fotos</button>

      <div id="perguntas-extra" class="oculto">
        <label class="lbl">Tem o petisco Filezitos no display?</label>
        <select id="sel-filezitos" onchange="checarPerguntasExtras()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem o petisco Tasty Bites no display?</label>
        <select id="sel-tasty" onchange="checarPerguntasExtras()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem o petisco Sheba Cremoso no display?</label>
        <select id="sel-sheba" onchange="checarPerguntasExtras()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>

        <label class="lbl">Tem algum sachê Pedigree Caramelo no display?</label>
        <select id="sel-sache" onchange="checarPerguntasExtras()">
          <option value="">— Selecione —</option><option value="Sim">Sim</option><option value="Não">Não</option>
        </select>
      </div>
    </div>

    <button class="btn btn-p" id="btn-enviar" onclick="enviarDados()" disabled style="margin-top:20px;">Enviar Auditoria</button>
  </div>
</div>

async function carregarModeloIA() {
  try {
    const urlAtual = window.location.href;
    const pastaBase = urlAtual.substring(0, urlAtual.lastIndexOf('/')) + '/';
    const urlAbsolutaModelo = pastaBase + 'model.json';

    modelYOLO = await tf.loadGraphModel(urlAbsolutaModelo);

    // "Aquece" o modelo com uma predição em branco agora, enquanto ainda mostra a
    // tela de carregamento. Da primeira vez que o modelo roda, o navegador compila
    // os shaders da GPU (WebGL) — isso é o que travava a tela na primeira foto do
    // promotor. Fazendo essa predição de aquecimento aqui, o travamento acontece
    // aqui (escondido) em vez de na hora que o promotor tira a foto de verdade.
    document.getElementById('ia-loading').innerText = "🧠 Preparando a Inteligência Artificial...";
    tf.tidy(() => {
      const entradaEmBranco = tf.zeros([1, 640, 640, 3]);
      let saida = modelYOLO.predict(entradaEmBranco);
      if (Array.isArray(saida)) saida = saida[0];
      else if (saida && !saida.shape) saida = Object.values(saida)[0];
      saida.dataSync(); // força a execução completa (e a compilação dos shaders) agora
    });

    document.getElementById('ia-loading').style.backgroundColor = "#d4edda";
    document.getElementById('ia-loading').style.color = "#155724";
    document.getElementById('ia-loading').innerText = "✅ Inteligência Artificial Ativa e Pronta!";
  } catch (error) {
    console.error("Erro ao carregar o modelo:", error);
    document.getElementById('ia-loading').style.backgroundColor = "#f8d7da";
    document.getElementById('ia-loading').style.color = "#721c24";
    document.getElementById('ia-loading').innerText = "⚠️ Erro ao carregar IA.";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  carregarModeloIA();
  popularSupervisores();
});

function popularSupervisores() {
  const select = document.getElementById('sel-sup');
  const sups = [...new Set(ROTEIRO.map(item => item.s))];
  sups.forEach(s => { const op = document.createElement('option'); op.value = s; op.text = s; select.appendChild(op); });
}

function liberarPromotor() {
  const supSel = document.getElementById('sel-sup').value;
  const promSelect = document.getElementById('sel-prom');
  promSelect.innerHTML = '<option value="">— Selecione —</option>';
  promSelect.disabled = true;
  document.getElementById('sel-loja').innerHTML = '<option value="">— Selecione —</option>';
  document.getElementById('sel-loja').disabled = true;
  document.getElementById('btn-t1').disabled = true;

  if(!supSel) return;
  const filtrados = ROTEIRO.filter(item => item.s === supSel);
  const promotores = [...new Set(filtrados.map(item => item.p))];
  promotores.forEach(p => { const op = document.createElement('option'); op.value = p; op.text = p; promSelect.appendChild(op); });
  promSelect.disabled = false;
}

function liberarLoja() {
  const supSel = document.getElementById('sel-sup').value;
  const promSel = document.getElementById('sel-prom').value;
  const lojaSelect = document.getElementById('sel-loja');
  lojaSelect.innerHTML = '<option value="">— Selecione —</option>';
  lojaSelect.disabled = true;
  document.getElementById('btn-t1').disabled = true;

  if(!promSel) return;
  const filtrados = ROTEIRO.filter(item => item.s === supSel && item.p === promSel);
  filtrados.forEach(item => { const op = document.createElement('option'); op.value = `${item.j}|${item.n}`; op.text = item.c; lojaSelect.appendChild(op); });
  lojaSelect.disabled = false;
}

let ehGrandeVarejo = false;   // true quando a bandeira da loja é EXATAMENTE "ATACADAO" ou "ASSAI"
let fluxoAtual = null;        // "tudao" ou "outra" — qual formulário está ativo no Passo 2

// A bandeira precisa ser EXATAMENTE "ATACADAO" ou "ASSAI" (sem parecidos, ex: "ATACADAO DIST
// COM E IND" é a REDE, mas a BANDEIRA já vem só "ATACADAO"). Comparação direta com o campo
// "b" (bandeira) do roteiro — sem aproximação de texto.
function ehLojaGrandeVarejo(itemRoteiro) {
  if (!itemRoteiro) return false;
  return itemRoteiro.b === "ATACADAO" || itemRoteiro.b === "ASSAI";
}

function configurarPerguntaTipoExposicao() {
  const select = document.getElementById('sel-tudao');
  const label = document.getElementById('lbl-tipo-exposicao');
  select.value = "";
  if (ehGrandeVarejo) {
    label.innerText = 'A loja tem "Tudão" ou outra exposição de Ponto Extra?';

async function habilitarContinuar() {
  const valorLoja = document.getElementById('sel-loja').value;
  const btnContinuar = document.getElementById('btn-t1');
  btnContinuar.disabled = true;
  if (!valorLoja) return;

  const cnpjSel = valorLoja.split("|")[0];
  const itemRoteiro = ROTEIRO.find(item => item.j === cnpjSel);
  ehGrandeVarejo = ehLojaGrandeVarejo(itemRoteiro);
  configurarPerguntaTipoExposicao();

  // Checa ANTES de liberar o formulário se essa loja já recebeu envio nesta semana
  btnContinuar.disabled = true;
  try {
    const resp = await fetch(`${APPS_SCRIPT_URL}?cnpj=${encodeURIComponent(cnpjSel)}`);
    const resultado = await resp.json();
    if (resultado.bloqueado) {

      document.getElementById('sel-loja').value = "";

    }

function tratarSelecaoTudao() {
  const valor = document.getElementById('sel-tudao').value;
  const areaFoto = document.getElementById('area-foto');
  const areaOutra = document.getElementById('area-outra-exposicao');
  document.getElementById('btn-enviar').disabled = true;

  if (valor === "Sim" || valor === "Tudão") {

    areaOutra.classList.add('oculto');

function obterLocalizacao() {
  document.getElementById('status-info').innerText = "Buscando localização GPS...";
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(async position => {
      latFinal = position.coords.latitude;
      lngFinal = position.coords.longitude;

      try {
        const resposta = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latFinal}&lon=${lngFinal}`);
        const dadosGeo = await resposta.json();
        endFinal = dadosGeo.display_name;
        document.getElementById('status-info').innerText = "📍 GPS e Endereço capturados com sucesso!";
        document.getElementById('status-info').style.color = "#155724";

      } catch (err) {
        endFinal = `Lat: ${latFinal}, Lng: ${lngFinal}`;
        document.getElementById('status-info').innerText = "📍 Coordenadas capturadas (Endereço indisponível)";
      }
    }, () => {
      document.getElementById('status-info').innerText = "⚠️ Ative o GPS/Localização para enviar a auditoria.";
    });
  }
}

    document.getElementById('status-info-outra').style.color = "#1E1D1A";

    const { resultado, escala, padX, padY } = executarDeteccaoIA(canvas);
    // Aqui só nos interessam Biscrok e Dreamies — ignora possíveis acertos
    // de classes do Tudão, que não fazem sentido numa "Outra Exposição".
    const resultadoRelevante = resultado.filter(b => ['biscrok', 'dreamies'].includes(CLASSES[b.classId]));

    fotoOutraTemporaria = canvasPreview.toDataURL('image/jpeg', 0.85);

      // Uma linha por classe (Biscrok/Dreamies), mesmo que existam várias caixas da

      const melhorPorClasse = {};
      resultadoRelevante.forEach(b => {
        const nome = CLASSES[b.classId];
        if (!melhorPorClasse[nome] || b.score > melhorPorClasse[nome]) {
          melhorPorClasse[nome] = b.score;
        }
      });
      const nomes = Object.entries(melhorPorClasse)
        .map(([nome, score]) => `${NOMES_AMIGAVEIS[nome]} (${Math.round(score * 100)}%)`)
        .join(' | ');
      document.getElementById('status-info-outra').innerText = `🎉 Identificado automaticamente: ${nomes}`;
      document.getElementById('status-info-outra').style.color = "#155724";
    } else {
      document.getElementById('status-info-outra').innerText = "🔍 Nenhum Biscrok/Dreamies reconhecido nesta foto. Confira antes de confirmar.";

    ultimaDeteccaoOutra = [];
    imgPreview.src = fotoOutraTemporaria;
    document.getElementById('status-info-outra').innerText = "📸 Foto guardada (IA offline). Confira manualmente.";
  }

function aplicarLetterbox(canvasOrigem, tamanho = 640) {
  const w = canvasOrigem.width, h = canvasOrigem.height;
  const escala = Math.min(tamanho / w, tamanho / h);
  const novaW = Math.round(w * escala), novaH = Math.round(h * escala);
  const padX = (tamanho - novaW) / 2, padY = (tamanho - novaH) / 2;

  const canvasDestino = document.createElement('canvas');
  canvasDestino.width = tamanho;
  canvasDestino.height = tamanho;
  const ctx = canvasDestino.getContext('2d');
  ctx.fillStyle = 'rgb(114,114,114)';
  ctx.fillRect(0, 0, tamanho, tamanho);
  ctx.drawImage(canvasOrigem, 0, 0, w, h, padX, padY, novaW, novaH);

  return { canvas: canvasDestino, escala, padX, padY };
}

// ==========================================
// Desenha o quadro atual do vídeo num canvas, já com a marca d'água de
// GPS/timestamp gravada. Usado tanto no fluxo do Tudão quanto no de Outra Exposição.
// ==========================================
function desenharQuadroComMarca(video) {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  timestampAtual = new Date().toLocaleString("pt-BR");

  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px sans-serif";
  ctx.fillText(`Data/Hora: ${timestampAtual}`, 10, canvas.height - 65);
  ctx.fillText(`Endereço: ${endFinal}`, 10, canvas.height - 40);
  ctx.fillText(`GPS: Lat: ${latFinal} | Lng: ${lngFinal}`, 10, canvas.height - 15);
  return canvas;
}

// ==========================================
// Roda a inferência do YOLO num canvas já capturado e devolve as caixas
// detectadas (score, classe, posição no espaço letterbox 640x640) junto
// com os parâmetros de escala/padding pra converter de volta pro tamanho real.
// Reutilizada tanto no fluxo do Tudão quanto no de Outra Exposição.
// ==========================================
function executarDeteccaoIA(canvas) {
  const { canvas: canvasLB, escala, padX, padY } = aplicarLetterbox(canvas, 640);

  const resultado = tf.tidy(() => {
    const tensor = tf.browser.fromPixels(canvasLB)
                   .toFloat()
                   .div(tf.scalar(255.0))
                   .expandDims(0);

    let saida = modelYOLO.predict(tensor);
    if (Array.isArray(saida)) saida = saida[0];
    else if (saida && !saida.shape) saida = Object.values(saida)[0];

    const shape = saida.shape;
    let numAtributos, numCaixas, transposto;
    if (shape[1] <= shape[2]) {
      numAtributos = shape[1]; numCaixas = shape[2]; transposto = false;
    } else {
      numAtributos = shape[2]; numCaixas = shape[1]; transposto = true;
    }

    const dados = saida.dataSync();
    let candidatas = [];

    for (let i = 0; i < numCaixas; i++) {
      let melhorScore = 0, melhorClasse = -1;
      for (let c = 0; c < CLASSES.length; c++) {
        const score = !transposto
          ? dados[(4 + c) * numCaixas + i]
          : dados[i * numAtributos + 4 + c];
        if (score > melhorScore) { melhorScore = score; melhorClasse = c; }
      }

      if (melhorScore > LIMIAR && CLASSES[melhorClasse] !== 'outro_display') {
        let cx, cy, bw, bh;
        if (!transposto) {
          cx = dados[0 * numCaixas + i]; cy = dados[1 * numCaixas + i];
          bw = dados[2 * numCaixas + i]; bh = dados[3 * numCaixas + i];
        } else {
          cx = dados[i * numAtributos + 0]; cy = dados[i * numAtributos + 1];
          bw = dados[i * numAtributos + 2]; bh = dados[i * numAtributos + 3];
        }
        candidatas.push({ cx, cy, bw, bh, score: melhorScore, classId: melhorClasse });
      }
    }

    // Remove caixas duplicadas da mesma classe muito próximas entre si
    candidatas.sort((a, b) => b.score - a.score);
    let finais = [];
    for (const cand of candidatas) {
      const duplicada = finais.some(f => f.classId === cand.classId &&
        Math.hypot(cand.cx - f.cx, cand.cy - f.cy) < 40);
      if (!duplicada) finais.push(cand);
    }

    return finais;
  });

  return { resultado, escala, padX, padY };
}

// Desenha as caixas do resultado da IA sobre uma cópia do canvas original
function desenharCaixasDeteccao(canvasBase, resultado, escala, padX, padY) {
  const canvasPreview = document.createElement('canvas');
  canvasPreview.width = canvasBase.width;
  canvasPreview.height = canvasBase.height;
  const ctxPrev = canvasPreview.getContext('2d');
  ctxPrev.drawImage(canvasBase, 0, 0);

  resultado.forEach(box => {
    const nomeClasse = CLASSES[box.classId];
    const cor = CORES[box.classId % CORES.length];

    const origX = (box.cx - padX) / escala;
    const origY = (box.cy - padY) / escala;
    const origW = box.bw / escala;
    const origH = box.bh / escala;
    const xmin = origX - origW / 2, ymin = origY - origH / 2;

    ctxPrev.strokeStyle = cor;
    ctxPrev.lineWidth = Math.max(3, canvasBase.width * 0.006);
    ctxPrev.strokeRect(xmin, ymin, origW, origH);

    const rotulo = `${(NOMES_AMIGAVEIS[nomeClasse] || nomeClasse)}: ${Math.round(box.score * 100)}%`;
    ctxPrev.font = `bold ${Math.max(16, canvasBase.width * 0.03)}px sans-serif`;
    const largura = ctxPrev.measureText(rotulo).width;
    ctxPrev.fillStyle = cor;
    ctxPrev.fillRect(xmin - 2, Math.max(0, ymin - 30), largura + 10, 30);
    ctxPrev.fillStyle = "#fff";
    ctxPrev.fillText(rotulo, xmin + 3, Math.max(20, ymin - 8));
  });

  return canvasPreview;
}

// CAPTURA DA FOTO + MARCA D'ÁGUA DE GPS + DETECÇÃO IA (fluxo do Tudão)
// ==========================================
async function capturarFoto() {

  if (modelYOLO) {

    document.getElementById('status-info').style.color = "#1E1D1A";

    const { resultado, escala, padX, padY } = executarDeteccaoIA(canvas);
    const canvasPreview = desenharCaixasDeteccao(canvas, resultado, escala, padX, padY);

    fotoTemporaria = canvasPreview.toDataURL('image/jpeg', 0.85);
    ultimaDeteccao = resultado;
    imgPreview.src = fotoTemporaria;

    // Monta a mensagem de alerta específica desta etapa
    const achouAlvo = resultado.find(b => CLASSES[b.classId] === etapa.alvo);
    let msg = achouAlvo
      ? `✨ ${NOMES_AMIGAVEIS[etapa.alvo]} detectado! (${Math.round(achouAlvo.score*100)}%) ✅`
      : `🔍 ${NOMES_AMIGAVEIS[etapa.alvo]} NÃO detectado nesta foto.`;

    if (etapa.bonus) {
      const achouBonus = resultado.find(b => CLASSES[b.classId] === etapa.bonus);
      if (achouBonus) {
        msg += `  🎉 ${NOMES_AMIGAVEIS[etapa.bonus]} identificado! (${Math.round(achouBonus.score*100)}%)`;
      } else {

      }
    }

    document.getElementById('status-info').innerText = msg;
    document.getElementById('status-info').style.color = achouAlvo ? "#155724" : "#721c24";

  } else {
    fotoTemporaria = canvas.toDataURL('image/jpeg', 0.8);
    ultimaDeteccao = [];
    imgPreview.src = fotoTemporaria;
    document.getElementById('status-info').innerText = "📸 Foto guardada (IA offline). Confira manualmente.";
  }

  document.getElementById('linha-botoes-revisao').classList.remove('oculto');
  const btnConfirmar = document.getElementById('btn-confirmar');
  btnConfirmar.innerText = (passoAtual === 2) ? "✅ Confirmar e Enviar" : "➡️ Confirmar e continuar";

  pararCamera();
}

  ultimaDeteccao = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('linha-botoes-revisao').classList.add('oculto');
  document.getElementById('camera-box').style.display = 'block';
  document.getElementById('btn-tirar-foto').classList.remove('oculto');
  const etapa = ETAPAS[passoAtual];
  document.getElementById('status-info').innerText = `Aguardando nova captura — ${etapa.label}...`;
  document.getElementById('status-info').style.color = "#b3261e";
  iniciarCamera();
}

async function confirmarFoto() {
  // Salva a foto confirmada desta etapa (com caixa, só pra galeria; sem caixa, pra imagem final)
  arrayFotosBase64[passoAtual] = fotoTemporaria;
  fotosLimpasBase64[passoAtual] = fotoLimpaTemporaria;

  // Acumula os itens encontrados em qualquer uma das fotos
  if (ultimaDeteccao) {
    ultimaDeteccao.forEach(box => {
      const nomeClasse = CLASSES[box.classId];
      if (itensEncontrados[nomeClasse] !== undefined) itensEncontrados[nomeClasse] = true;
    });
  }

  // Adiciona miniatura na galeria
  const thumb = document.createElement('img');
  thumb.src = fotoTemporaria;
  document.getElementById('galeria-fotos').appendChild(thumb);

  if (passoAtual < 2) {
    iniciarEtapa(passoAtual + 1);
    iniciarCamera();
  } else {
    // Finalizou as 3 fotos
    document.getElementById('camera-box').style.display = 'none';
    document.getElementById('btn-tirar-foto').classList.add('oculto');
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('linha-botoes-revisao').classList.add('oculto');
    document.getElementById('btn-refazer-tudo').classList.remove('oculto');
    atualizarProgresso();
    document.getElementById('prog-3').classList.add('feito');

    const temTudao = itensEncontrados.tudao_frente || itensEncontrados.tudao_cao || itensEncontrados.tudao_gato;
    document.getElementById('sel-tudao').value = temTudao ? "Sim" : "Não";

    document.getElementById('status-info').innerText = "🖼️ Montando imagem final...";
    document.getElementById('status-info').style.color = "#5F5E5A";

    try {
      fotoFinalCombinada = await montarImagemFinal(fotosLimpasBase64);
    } catch (erro) {
      console.error("Erro ao montar imagem final:", erro);
      fotoFinalCombinada = fotosLimpasBase64[0] || "";
    }

    const resumo = `🎉 3 fotos concluídas!\n` +
      `Tudão: ${temTudao ? "Detectado ✅" : "NÃO detectado ⚠️"}\n` +
      `Dreamies: ${itensEncontrados.dreamies ? "Sim ✅" : "Não"}\n` +
      `Biscrok: ${itensEncontrados.biscrok ? "Sim ✅" : "Não"}\n` +
      `Responda abaixo os demais itens do display:`;
    document.getElementById('status-info').innerText = resumo;
    document.getElementById('status-info').style.color = temTudao ? "#155724" : "#721c24";

    document.getElementById('perguntas-extra').classList.remove('oculto');
    checarPerguntasExtras();
  }
}

// Só libera o envio quando as 4 perguntas extras forem respondidas
function checarPerguntasExtras() {
  const ids = ['sel-filezitos', 'sel-tasty', 'sel-sheba', 'sel-sache'];
  const todasRespondidas = ids.every(id => document.getElementById(id).value !== "");
  document.getElementById('btn-enviar').disabled = !todasRespondidas;
}

// Monta 1 única imagem juntando as 3 fotos LADO A LADO (sem caixas de detecção),
// cada uma já com seu timestamp/GPS gravado.
function carregarImagem(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function montarImagemFinal(fotosBase64) {
  const alturaFinal = 500; // cada foto é redimensionada para essa altura
  const espaco = 6;

  const imagens = await Promise.all(fotosBase64.map(src => carregarImagem(src)));
  const largurasEscaladas = imagens.map(img => Math.round(img.width * (alturaFinal / img.height)));
  const larguraTotal = espaco + largurasEscaladas.reduce((soma, w) => soma + w + espaco, 0);

  const canvasFinal = document.createElement('canvas');
  canvasFinal.width = larguraTotal;
  canvasFinal.height = alturaFinal + espaco * 2;
  const ctx = canvasFinal.getContext('2d');
  ctx.fillStyle = "#1E1D1A";
  ctx.fillRect(0, 0, canvasFinal.width, canvasFinal.height);

  let x = espaco;
  imagens.forEach((img, i) => {
    ctx.drawImage(img, x, espaco, largurasEscaladas[i], alturaFinal);
    x += largurasEscaladas[i] + espaco;
  });

  return canvasFinal.toDataURL('image/jpeg', 0.85);
}

function refazerTudo() {
  arrayFotosBase64 = [];
  fotosLimpasBase64 = [];
  fotoFinalCombinada = "";
  itensEncontrados = { tudao_frente:false, tudao_cao:false, tudao_gato:false, dreamies:false, biscrok:false };
  document.getElementById('galeria-fotos').innerHTML = '';
  document.getElementById('btn-refazer-tudo').classList.add('oculto');
  document.getElementById('perguntas-extra').classList.add('oculto');
  ['sel-filezitos','sel-tasty','sel-sheba','sel-sache'].forEach(id => document.getElementById(id).value = "");
  document.getElementById('btn-enviar').disabled = true;
  iniciarEtapa(0);
  iniciarCamera('video-camera');
}

function enviarDados() {
  if (fluxoAtual === "tudao") {
    if (!fotoFinalCombinada) {
      alert("Aguarde a imagem final terminar de ser montada e tente novamente.");
      return;
    }
    enviarPayload({
      tipoExposicao: "Tudão",
      nomeDisplay: "",
      temTudao: document.getElementById('sel-tudao').value,
      temDreamies: itensEncontrados.dreamies ? "Sim" : "Não",
      temBiscrok: itensEncontrados.biscrok ? "Sim" : "Não",
      temFilezitos: document.getElementById('sel-filezitos').value,
      temTastyBites: document.getElementById('sel-tasty').value,
      temShebaCremoso: document.getElementById('sel-sheba').value,
      temSacheCaramelo: document.getElementById('sel-sache').value,
      image: fotoFinalCombinada   // 1 imagem única: Frente + Lateral Cão + Lateral Gato lado a lado
    });
  } else if (fluxoAtual === "outra") {
    if (!fotoFinalOutraCombinada) {
      alert("Aguarde a imagem final terminar de ser montada e tente novamente.");
      return;
    }
    enviarPayload({
      tipoExposicao: "Outra Exposição",
      nomeDisplay: document.getElementById('input-nome-display').value.trim(),
      temTudao: document.getElementById('input-nome-display').value.trim(), // ex: "Sobrecito" — não é Tudão, então registra qual é o ponto extra
      temDreamies: itensEncontradosOutra.dreamies ? "Sim" : "Não",
      temBiscrok: itensEncontradosOutra.biscrok ? "Sim" : "Não",
      temFilezitos: document.getElementById('sel-o-filezitos').value,
      temTastyBites: document.getElementById('sel-o-tasty').value,
      temShebaCremoso: document.getElementById('sel-o-sheba').value,
      temSacheCaramelo: document.getElementById('sel-o-sache').value,
      image: fotoFinalOutraCombinada   // 1 imagem única: as fotos da exposição lado a lado
    });
  } else {
    alert("Selecione o tipo de exposição da loja antes de enviar.");
  }
}

function enviarPayload(dadosExtras) {
  const btn = document.getElementById('btn-enviar');
  btn.innerText = "Enviando... Não feche a página!";
  btn.disabled = true;

  const lojaCompleta = document.getElementById('sel-loja').value;
  const cnpjLoja = lojaCompleta.split("|")[0];
  const nomeLoja = lojaCompleta.split("|")[1];

  const payload = Object.assign({
    supervisor: document.getElementById('sel-sup').value,
    promotor: document.getElementById('sel-prom').value,
    cnpj: cnpjLoja,
    loja: nomeLoja,
    lat: latFinal,
    lng: lngFinal,
    endereco: endFinal,
    timestamp: timestampAtual
  }, dadosExtras);

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if(data.status === "success") {
      alert("✅ Auditoria enviada com sucesso!");
      window.location.reload();
    } else if (data.status === "duplicado") {
      alert("⚠️ " + data.message);
      btn.innerText = "Enviar Auditoria";
      btn.disabled = false;
    } else {
      alert("Erro ao salvar! Tente novamente...");
      btn.innerText = "Enviar Auditoria";
      btn.disabled = false;
    }
  })
  .catch(() => {
    alert("Erro na conexão!");
    btn.innerText = "Enviar Auditoria";
    btn.disabled = false;
  });
}
</script>
